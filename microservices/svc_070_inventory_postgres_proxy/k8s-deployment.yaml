apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-postgres-proxy
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: inventory-postgres-proxy
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-070
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inventory-postgres-proxy
  template:
    metadata:
      labels:
        app: inventory-postgres-proxy
        tier: database
        service-id: svc-070
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8070"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-06
      containers:
      - name: inventory-postgres-proxy
        image: selfhealing/inventory-postgres-proxy:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8070
          name: http
        resources:
          requests:
            cpu: "340m"
            memory: "640Mi"
          limits:
            cpu: "1000m"
            memory: "1600Mi"
        env:
        - name: SERVICE_ID
          value: "svc-070"
        - name: SERVICE_NAME
          value: "Inventory-Postgres-Proxy"
        - name: PORT
          value: "8070"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '45'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8070
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8070
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-postgres-proxy
  namespace: self-healing-ecosystem
  labels:
    app: inventory-postgres-proxy
spec:
  type: ClusterIP
  ports:
  - port: 8070
    targetPort: 8070
    protocol: TCP
    name: http
  selector:
    app: inventory-postgres-proxy
