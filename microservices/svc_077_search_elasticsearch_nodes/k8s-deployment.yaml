apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-elasticsearch-nodes
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: search-elasticsearch-nodes
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-077
spec:
  replicas: 3
  selector:
    matchLabels:
      app: search-elasticsearch-nodes
  template:
    metadata:
      labels:
        app: search-elasticsearch-nodes
        tier: database
        service-id: svc-077
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8077"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-05
      containers:
      - name: search-elasticsearch-nodes
        image: selfhealing/search-elasticsearch-nodes:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8077
          name: http
        resources:
          requests:
            cpu: "440m"
            memory: "920Mi"
          limits:
            cpu: "1000m"
            memory: "2300Mi"
        env:
        - name: SERVICE_ID
          value: "svc-077"
        - name: SERVICE_NAME
          value: "Search-Elasticsearch-Nodes"
        - name: PORT
          value: "8077"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '45'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8077
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8077
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: search-elasticsearch-nodes
  namespace: self-healing-ecosystem
  labels:
    app: search-elasticsearch-nodes
spec:
  type: ClusterIP
  ports:
  - port: 8077
    targetPort: 8077
    protocol: TCP
    name: http
  selector:
    app: search-elasticsearch-nodes
