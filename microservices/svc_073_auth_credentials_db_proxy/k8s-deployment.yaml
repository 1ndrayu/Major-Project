apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-credentials-db-proxy
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: auth-credentials-db-proxy
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-073
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth-credentials-db-proxy
  template:
    metadata:
      labels:
        app: auth-credentials-db-proxy
        tier: database
        service-id: svc-073
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8073"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01
      containers:
      - name: auth-credentials-db-proxy
        image: selfhealing/auth-credentials-db-proxy:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8073
          name: http
        resources:
          requests:
            cpu: "260m"
            memory: "490Mi"
          limits:
            cpu: "1000m"
            memory: "1225Mi"
        env:
        - name: SERVICE_ID
          value: "svc-073"
        - name: SERVICE_NAME
          value: "Auth-Credentials-DB-Proxy"
        - name: PORT
          value: "8073"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '40'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8073
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8073
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-credentials-db-proxy
  namespace: self-healing-ecosystem
  labels:
    app: auth-credentials-db-proxy
spec:
  type: ClusterIP
  ports:
  - port: 8073
    targetPort: 8073
    protocol: TCP
    name: http
  selector:
    app: auth-credentials-db-proxy
