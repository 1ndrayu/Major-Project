apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-state-service
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: cart-state-service
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-018
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cart-state-service
  template:
    metadata:
      labels:
        app: cart-state-service
        tier: order_payment
        service-id: svc-018
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8018"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-02
      containers:
      - name: cart-state-service
        image: selfhealing/cart-state-service:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8018
          name: http
        resources:
          requests:
            cpu: "280m"
            memory: "450Mi"
          limits:
            cpu: "1000m"
            memory: "1125Mi"
        env:
        - name: SERVICE_ID
          value: "svc-018"
        - name: SERVICE_NAME
          value: "Cart-State-Service"
        - name: PORT
          value: "8018"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8018
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8018
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cart-state-service
  namespace: self-healing-ecosystem
  labels:
    app: cart-state-service
spec:
  type: ClusterIP
  ports:
  - port: 8018
    targetPort: 8018
    protocol: TCP
    name: http
  selector:
    app: cart-state-service
