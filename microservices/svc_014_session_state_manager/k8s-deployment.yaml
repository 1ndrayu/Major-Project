apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-state-manager
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: session-state-manager
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-014
spec:
  replicas: 3
  selector:
    matchLabels:
      app: session-state-manager
  template:
    metadata:
      labels:
        app: session-state-manager
        tier: middleware
        service-id: svc-014
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8014"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-06
      containers:
      - name: session-state-manager
        image: selfhealing/session-state-manager:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8014
          name: http
        resources:
          requests:
            cpu: "180m"
            memory: "290Mi"
          limits:
            cpu: "1000m"
            memory: "725Mi"
        env:
        - name: SERVICE_ID
          value: "svc-014"
        - name: SERVICE_NAME
          value: "Session-State-Manager"
        - name: PORT
          value: "8014"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8014
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8014
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: session-state-manager
  namespace: self-healing-ecosystem
  labels:
    app: session-state-manager
spec:
  type: ClusterIP
  ports:
  - port: 8014
    targetPort: 8014
    protocol: TCP
    name: http
  selector:
    app: session-state-manager
