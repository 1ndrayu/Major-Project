apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-route-planner
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: dispatch-route-planner
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-049
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dispatch-route-planner
  template:
    metadata:
      labels:
        app: dispatch-route-planner
        tier: middleware
        service-id: svc-049
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8049"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01
      containers:
      - name: dispatch-route-planner
        image: selfhealing/dispatch-route-planner:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8049
          name: http
        resources:
          requests:
            cpu: "290m"
            memory: "520Mi"
          limits:
            cpu: "1000m"
            memory: "1300Mi"
        env:
        - name: SERVICE_ID
          value: "svc-049"
        - name: SERVICE_NAME
          value: "Dispatch-Route-Planner"
        - name: PORT
          value: "8049"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8049
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8049
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dispatch-route-planner
  namespace: self-healing-ecosystem
  labels:
    app: dispatch-route-planner
spec:
  type: ClusterIP
  ports:
  - port: 8049
    targetPort: 8049
    protocol: TCP
    name: http
  selector:
    app: dispatch-route-planner
