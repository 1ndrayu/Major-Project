apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-security-filter
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: waf-security-filter
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: gateway
    service-id: svc-010
spec:
  replicas: 5
  selector:
    matchLabels:
      app: waf-security-filter
  template:
    metadata:
      labels:
        app: waf-security-filter
        tier: gateway
        service-id: svc-010
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8010"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-02
      containers:
      - name: waf-security-filter
        image: selfhealing/waf-security-filter:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8010
          name: http
        resources:
          requests:
            cpu: "240m"
            memory: "390Mi"
          limits:
            cpu: "1000m"
            memory: "975Mi"
        env:
        - name: SERVICE_ID
          value: "svc-010"
        - name: SERVICE_NAME
          value: "WAF-Security-Filter"
        - name: PORT
          value: "8010"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8010
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8010
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: waf-security-filter
  namespace: self-healing-ecosystem
  labels:
    app: waf-security-filter
spec:
  type: ClusterIP
  ports:
  - port: 8010
    targetPort: 8010
    protocol: TCP
    name: http
  selector:
    app: waf-security-filter
