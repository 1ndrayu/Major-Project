apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-bff-gateway
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: mobile-bff-gateway
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: frontend
    service-id: svc-002
spec:
  replicas: 5
  selector:
    matchLabels:
      app: mobile-bff-gateway
  template:
    metadata:
      labels:
        app: mobile-bff-gateway
        tier: frontend
        service-id: svc-002
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-02
      containers:
      - name: mobile-bff-gateway
        image: selfhealing/mobile-bff-gateway:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
          name: http
        resources:
          requests:
            cpu: "220m"
            memory: "310Mi"
          limits:
            cpu: "1000m"
            memory: "775Mi"
        env:
        - name: SERVICE_ID
          value: "svc-002"
        - name: SERVICE_NAME
          value: "Mobile-BFF-Gateway"
        - name: PORT
          value: "8002"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mobile-bff-gateway
  namespace: self-healing-ecosystem
  labels:
    app: mobile-bff-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
    name: http
  selector:
    app: mobile-bff-gateway
