apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-recommendation-feed
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: product-recommendation-feed
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-044
spec:
  replicas: 3
  selector:
    matchLabels:
      app: product-recommendation-feed
  template:
    metadata:
      labels:
        app: product-recommendation-feed
        tier: middleware
        service-id: svc-044
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8044"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-04
      containers:
      - name: product-recommendation-feed
        image: selfhealing/product-recommendation-feed:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8044
          name: http
        resources:
          requests:
            cpu: "380m"
            memory: "720Mi"
          limits:
            cpu: "1000m"
            memory: "1800Mi"
        env:
        - name: SERVICE_ID
          value: "svc-044"
        - name: SERVICE_NAME
          value: "Product-Recommendation-Feed"
        - name: PORT
          value: "8044"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8044
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8044
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: product-recommendation-feed
  namespace: self-healing-ecosystem
  labels:
    app: product-recommendation-feed
spec:
  type: ClusterIP
  ports:
  - port: 8044
    targetPort: 8044
    protocol: TCP
    name: http
  selector:
    app: product-recommendation-feed
