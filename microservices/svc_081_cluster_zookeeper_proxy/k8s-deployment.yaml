apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-zookeeper-proxy
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: cluster-zookeeper-proxy
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-081
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cluster-zookeeper-proxy
  template:
    metadata:
      labels:
        app: cluster-zookeeper-proxy
        tier: database
        service-id: svc-081
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01
      containers:
      - name: cluster-zookeeper-proxy
        image: selfhealing/cluster-zookeeper-proxy:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
        resources:
          requests:
            cpu: "190m"
            memory: "350Mi"
          limits:
            cpu: "1000m"
            memory: "875Mi"
        env:
        - name: SERVICE_ID
          value: "svc-081"
        - name: SERVICE_NAME
          value: "Cluster-ZooKeeper-Proxy"
        - name: PORT
          value: "8081"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '30'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-zookeeper-proxy
  namespace: self-healing-ecosystem
  labels:
    app: cluster-zookeeper-proxy
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: cluster-zookeeper-proxy
