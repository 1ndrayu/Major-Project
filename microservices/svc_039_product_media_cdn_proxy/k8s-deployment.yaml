apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-media-cdn-proxy
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: product-media-cdn-proxy
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-039
spec:
  replicas: 3
  selector:
    matchLabels:
      app: product-media-cdn-proxy
  template:
    metadata:
      labels:
        app: product-media-cdn-proxy
        tier: middleware
        service-id: svc-039
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8039"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-07
      containers:
      - name: product-media-cdn-proxy
        image: selfhealing/product-media-cdn-proxy:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8039
          name: http
        resources:
          requests:
            cpu: "260m"
            memory: "460Mi"
          limits:
            cpu: "1000m"
            memory: "1150Mi"
        env:
        - name: SERVICE_ID
          value: "svc-039"
        - name: SERVICE_NAME
          value: "Product-Media-CDN-Proxy"
        - name: PORT
          value: "8039"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8039
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8039
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: product-media-cdn-proxy
  namespace: self-healing-ecosystem
  labels:
    app: product-media-cdn-proxy
spec:
  type: ClusterIP
  ports:
  - port: 8039
    targetPort: 8039
    protocol: TCP
    name: http
  selector:
    app: product-media-cdn-proxy
