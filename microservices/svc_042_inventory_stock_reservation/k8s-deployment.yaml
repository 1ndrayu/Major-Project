apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-stock-reservation
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: inventory-stock-reservation
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-042
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inventory-stock-reservation
  template:
    metadata:
      labels:
        app: inventory-stock-reservation
        tier: middleware
        service-id: svc-042
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8042"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-02
      containers:
      - name: inventory-stock-reservation
        image: selfhealing/inventory-stock-reservation:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8042
          name: http
        resources:
          requests:
            cpu: "360m"
            memory: "610Mi"
          limits:
            cpu: "1000m"
            memory: "1525Mi"
        env:
        - name: SERVICE_ID
          value: "svc-042"
        - name: SERVICE_NAME
          value: "Inventory-Stock-Reservation"
        - name: PORT
          value: "8042"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8042
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8042
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-stock-reservation
  namespace: self-healing-ecosystem
  labels:
    app: inventory-stock-reservation
spec:
  type: ClusterIP
  ports:
  - port: 8042
    targetPort: 8042
    protocol: TCP
    name: http
  selector:
    app: inventory-stock-reservation
