apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-replica-pool
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: reporting-replica-pool
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-076
spec:
  replicas: 3
  selector:
    matchLabels:
      app: reporting-replica-pool
  template:
    metadata:
      labels:
        app: reporting-replica-pool
        tier: database
        service-id: svc-076
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8076"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-04
      containers:
      - name: reporting-replica-pool
        image: selfhealing/reporting-replica-pool:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8076
          name: http
        resources:
          requests:
            cpu: "290m"
            memory: "540Mi"
          limits:
            cpu: "1000m"
            memory: "1350Mi"
        env:
        - name: SERVICE_ID
          value: "svc-076"
        - name: SERVICE_NAME
          value: "Reporting-Replica-Pool"
        - name: PORT
          value: "8076"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '35'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8076
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8076
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-replica-pool
  namespace: self-healing-ecosystem
  labels:
    app: reporting-replica-pool
spec:
  type: ClusterIP
  ports:
  - port: 8076
    targetPort: 8076
    protocol: TCP
    name: http
  selector:
    app: reporting-replica-pool
