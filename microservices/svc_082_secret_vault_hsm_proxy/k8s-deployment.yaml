apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-vault-hsm-proxy
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: secret-vault-hsm-proxy
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-082
spec:
  replicas: 3
  selector:
    matchLabels:
      app: secret-vault-hsm-proxy
  template:
    metadata:
      labels:
        app: secret-vault-hsm-proxy
        tier: database
        service-id: svc-082
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-02
      containers:
      - name: secret-vault-hsm-proxy
        image: selfhealing/secret-vault-hsm-proxy:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          name: http
        resources:
          requests:
            cpu: "220m"
            memory: "380Mi"
          limits:
            cpu: "1000m"
            memory: "950Mi"
        env:
        - name: SERVICE_ID
          value: "svc-082"
        - name: SERVICE_NAME
          value: "Secret-Vault-HSM-Proxy"
        - name: PORT
          value: "8082"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '30'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: secret-vault-hsm-proxy
  namespace: self-healing-ecosystem
  labels:
    app: secret-vault-hsm-proxy
spec:
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: http
  selector:
    app: secret-vault-hsm-proxy
