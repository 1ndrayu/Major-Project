apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-account-db-proxy
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: user-account-db-proxy
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-067
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-account-db-proxy
  template:
    metadata:
      labels:
        app: user-account-db-proxy
        tier: database
        service-id: svc-067
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8067"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-03
      containers:
      - name: user-account-db-proxy
        image: selfhealing/user-account-db-proxy:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8067
          name: http
        resources:
          requests:
            cpu: "300m"
            memory: "580Mi"
          limits:
            cpu: "1000m"
            memory: "1450Mi"
        env:
        - name: SERVICE_ID
          value: "svc-067"
        - name: SERVICE_NAME
          value: "User-Account-DB-Proxy"
        - name: PORT
          value: "8067"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '45'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8067
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8067
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-account-db-proxy
  namespace: self-healing-ecosystem
  labels:
    app: user-account-db-proxy
spec:
  type: ClusterIP
  ports:
  - port: 8067
    targetPort: 8067
    protocol: TCP
    name: http
  selector:
    app: user-account-db-proxy
