apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-recommendation-inference
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: ml-recommendation-inference
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: analytics
    service-id: svc-090
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ml-recommendation-inference
  template:
    metadata:
      labels:
        app: ml-recommendation-inference
        tier: analytics
        service-id: svc-090
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-02
      containers:
      - name: ml-recommendation-inference
        image: selfhealing/ml-recommendation-inference:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8090
          name: http
        resources:
          requests:
            cpu: "480m"
            memory: "960Mi"
          limits:
            cpu: "1000m"
            memory: "2400Mi"
        env:
        - name: SERVICE_ID
          value: "svc-090"
        - name: SERVICE_NAME
          value: "ML-Recommendation-Inference"
        - name: PORT
          value: "8090"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ml-recommendation-inference
  namespace: self-healing-ecosystem
  labels:
    app: ml-recommendation-inference
spec:
  type: ClusterIP
  ports:
  - port: 8090
    targetPort: 8090
    protocol: TCP
    name: http
  selector:
    app: ml-recommendation-inference
