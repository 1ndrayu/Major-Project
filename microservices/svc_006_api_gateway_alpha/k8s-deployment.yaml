apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-alpha
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: api-gateway-alpha
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: gateway
    service-id: svc-006
spec:
  replicas: 5
  selector:
    matchLabels:
      app: api-gateway-alpha
  template:
    metadata:
      labels:
        app: api-gateway-alpha
        tier: gateway
        service-id: svc-006
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8006"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-06
      containers:
      - name: api-gateway-alpha
        image: selfhealing/api-gateway-alpha:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8006
          name: http
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1280Mi"
        env:
        - name: SERVICE_ID
          value: "svc-006"
        - name: SERVICE_NAME
          value: "API-Gateway-Alpha"
        - name: PORT
          value: "8006"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8006
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8006
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-alpha
  namespace: self-healing-ecosystem
  labels:
    app: api-gateway-alpha
spec:
  type: ClusterIP
  ports:
  - port: 8006
    targetPort: 8006
    protocol: TCP
    name: http
  selector:
    app: api-gateway-alpha
