apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-redis-cluster-proxy
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: cart-redis-cluster-proxy
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-071
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cart-redis-cluster-proxy
  template:
    metadata:
      labels:
        app: cart-redis-cluster-proxy
        tier: database
        service-id: svc-071
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8071"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-07
      containers:
      - name: cart-redis-cluster-proxy
        image: selfhealing/cart-redis-cluster-proxy:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8071
          name: http
        resources:
          requests:
            cpu: "200m"
            memory: "420Mi"
          limits:
            cpu: "1000m"
            memory: "1050Mi"
        env:
        - name: SERVICE_ID
          value: "svc-071"
        - name: SERVICE_NAME
          value: "Cart-Redis-Cluster-Proxy"
        - name: PORT
          value: "8071"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '60'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8071
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8071
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cart-redis-cluster-proxy
  namespace: self-healing-ecosystem
  labels:
    app: cart-redis-cluster-proxy
spec:
  type: ClusterIP
  ports:
  - port: 8071
    targetPort: 8071
    protocol: TCP
    name: http
  selector:
    app: cart-redis-cluster-proxy
