apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-exchange-service
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: currency-exchange-service
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-025
spec:
  replicas: 3
  selector:
    matchLabels:
      app: currency-exchange-service
  template:
    metadata:
      labels:
        app: currency-exchange-service
        tier: order_payment
        service-id: svc-025
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8025"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01
      containers:
      - name: currency-exchange-service
        image: selfhealing/currency-exchange-service:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8025
          name: http
        resources:
          requests:
            cpu: "140m"
            memory: "250Mi"
          limits:
            cpu: "1000m"
            memory: "625Mi"
        env:
        - name: SERVICE_ID
          value: "svc-025"
        - name: SERVICE_NAME
          value: "Currency-Exchange-Service"
        - name: PORT
          value: "8025"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8025
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8025
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: currency-exchange-service
  namespace: self-healing-ecosystem
  labels:
    app: currency-exchange-service
spec:
  type: ClusterIP
  ports:
  - port: 8025
    targetPort: 8025
    protocol: TCP
    name: http
  selector:
    app: currency-exchange-service
