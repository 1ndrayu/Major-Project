apiVersion: apps/v1
kind: Deployment
metadata:
  name: gift-card-manager
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: gift-card-manager
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-028
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gift-card-manager
  template:
    metadata:
      labels:
        app: gift-card-manager
        tier: order_payment
        service-id: svc-028
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8028"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-04
      containers:
      - name: gift-card-manager
        image: selfhealing/gift-card-manager:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8028
          name: http
        resources:
          requests:
            cpu: "150m"
            memory: "270Mi"
          limits:
            cpu: "1000m"
            memory: "675Mi"
        env:
        - name: SERVICE_ID
          value: "svc-028"
        - name: SERVICE_NAME
          value: "Gift-Card-Manager"
        - name: PORT
          value: "8028"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8028
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8028
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gift-card-manager
  namespace: self-healing-ecosystem
  labels:
    app: gift-card-manager
spec:
  type: ClusterIP
  ports:
  - port: 8028
    targetPort: 8028
    protocol: TCP
    name: http
  selector:
    app: gift-card-manager
