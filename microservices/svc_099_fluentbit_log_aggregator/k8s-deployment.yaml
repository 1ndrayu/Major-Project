apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluentbit-log-aggregator
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: fluentbit-log-aggregator
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: analytics
    service-id: svc-099
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fluentbit-log-aggregator
  template:
    metadata:
      labels:
        app: fluentbit-log-aggregator
        tier: analytics
        service-id: svc-099
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8099"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-03
      containers:
      - name: fluentbit-log-aggregator
        image: selfhealing/fluentbit-log-aggregator:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8099
          name: http
        resources:
          requests:
            cpu: "320m"
            memory: "620Mi"
          limits:
            cpu: "1000m"
            memory: "1550Mi"
        env:
        - name: SERVICE_ID
          value: "svc-099"
        - name: SERVICE_NAME
          value: "FluentBit-Log-Aggregator"
        - name: PORT
          value: "8099"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8099
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8099
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fluentbit-log-aggregator
  namespace: self-healing-ecosystem
  labels:
    app: fluentbit-log-aggregator
spec:
  type: ClusterIP
  ports:
  - port: 8099
    targetPort: 8099
    protocol: TCP
    name: http
  selector:
    app: fluentbit-log-aggregator
