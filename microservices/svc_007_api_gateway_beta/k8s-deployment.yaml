apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-beta
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: api-gateway-beta
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: gateway
    service-id: svc-007
spec:
  replicas: 5
  selector:
    matchLabels:
      app: api-gateway-beta
  template:
    metadata:
      labels:
        app: api-gateway-beta
        tier: gateway
        service-id: svc-007
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8007"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-07
      containers:
      - name: api-gateway-beta
        image: selfhealing/api-gateway-beta:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8007
          name: http
        resources:
          requests:
            cpu: "280m"
            memory: "480Mi"
          limits:
            cpu: "1000m"
            memory: "1200Mi"
        env:
        - name: SERVICE_ID
          value: "svc-007"
        - name: SERVICE_NAME
          value: "API-Gateway-Beta"
        - name: PORT
          value: "8007"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8007
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8007
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-beta
  namespace: self-healing-ecosystem
  labels:
    app: api-gateway-beta
spec:
  type: ClusterIP
  ports:
  - port: 8007
    targetPort: 8007
    protocol: TCP
    name: http
  selector:
    app: api-gateway-beta
