apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-audit-trail
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: payment-audit-trail
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-021
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-audit-trail
  template:
    metadata:
      labels:
        app: payment-audit-trail
        tier: order_payment
        service-id: svc-021
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8021"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-05
      containers:
      - name: payment-audit-trail
        image: selfhealing/payment-audit-trail:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8021
          name: http
        resources:
          requests:
            cpu: "180m"
            memory: "340Mi"
          limits:
            cpu: "1000m"
            memory: "850Mi"
        env:
        - name: SERVICE_ID
          value: "svc-021"
        - name: SERVICE_NAME
          value: "Payment-Audit-Trail"
        - name: PORT
          value: "8021"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8021
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8021
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-audit-trail
  namespace: self-healing-ecosystem
  labels:
    app: payment-audit-trail
spec:
  type: ClusterIP
  ports:
  - port: 8021
    targetPort: 8021
    protocol: TCP
    name: http
  selector:
    app: payment-audit-trail
