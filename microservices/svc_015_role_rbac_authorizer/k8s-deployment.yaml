apiVersion: apps/v1
kind: Deployment
metadata:
  name: role-rbac-authorizer
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: role-rbac-authorizer
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-015
spec:
  replicas: 3
  selector:
    matchLabels:
      app: role-rbac-authorizer
  template:
    metadata:
      labels:
        app: role-rbac-authorizer
        tier: middleware
        service-id: svc-015
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8015"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-07
      containers:
      - name: role-rbac-authorizer
        image: selfhealing/role-rbac-authorizer:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8015
          name: http
        resources:
          requests:
            cpu: "160m"
            memory: "260Mi"
          limits:
            cpu: "1000m"
            memory: "650Mi"
        env:
        - name: SERVICE_ID
          value: "svc-015"
        - name: SERVICE_NAME
          value: "Role-RBAC-Authorizer"
        - name: PORT
          value: "8015"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8015
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8015
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: role-rbac-authorizer
  namespace: self-healing-ecosystem
  labels:
    app: role-rbac-authorizer
spec:
  type: ClusterIP
  ports:
  - port: 8015
    targetPort: 8015
    protocol: TCP
    name: http
  selector:
    app: role-rbac-authorizer
