apiVersion: apps/v1
kind: Deployment
metadata:
  name: read-replica-pool-alpha
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: read-replica-pool-alpha
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-083
spec:
  replicas: 3
  selector:
    matchLabels:
      app: read-replica-pool-alpha
  template:
    metadata:
      labels:
        app: read-replica-pool-alpha
        tier: database
        service-id: svc-083
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-03
      containers:
      - name: read-replica-pool-alpha
        image: selfhealing/read-replica-pool-alpha:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
          name: http
        resources:
          requests:
            cpu: "310m"
            memory: "590Mi"
          limits:
            cpu: "1000m"
            memory: "1475Mi"
        env:
        - name: SERVICE_ID
          value: "svc-083"
        - name: SERVICE_NAME
          value: "Read-Replica-Pool-Alpha"
        - name: PORT
          value: "8083"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '45'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: read-replica-pool-alpha
  namespace: self-healing-ecosystem
  labels:
    app: read-replica-pool-alpha
spec:
  type: ClusterIP
  ports:
  - port: 8083
    targetPort: 8083
    protocol: TCP
    name: http
  selector:
    app: read-replica-pool-alpha
