apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-cache-memcached
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: token-cache-memcached
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-080
spec:
  replicas: 3
  selector:
    matchLabels:
      app: token-cache-memcached
  template:
    metadata:
      labels:
        app: token-cache-memcached
        tier: database
        service-id: svc-080
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-08
      containers:
      - name: token-cache-memcached
        image: selfhealing/token-cache-memcached:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "160m"
            memory: "320Mi"
          limits:
            cpu: "1000m"
            memory: "800Mi"
        env:
        - name: SERVICE_ID
          value: "svc-080"
        - name: SERVICE_NAME
          value: "Token-Cache-Memcached"
        - name: PORT
          value: "8080"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '60'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: token-cache-memcached
  namespace: self-healing-ecosystem
  labels:
    app: token-cache-memcached
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: token-cache-memcached
