apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-store-reader
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: feature-store-reader
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: analytics
    service-id: svc-092
spec:
  replicas: 3
  selector:
    matchLabels:
      app: feature-store-reader
  template:
    metadata:
      labels:
        app: feature-store-reader
        tier: analytics
        service-id: svc-092
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8092"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-04
      containers:
      - name: feature-store-reader
        image: selfhealing/feature-store-reader:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8092
          name: http
        resources:
          requests:
            cpu: "300m"
            memory: "560Mi"
          limits:
            cpu: "1000m"
            memory: "1400Mi"
        env:
        - name: SERVICE_ID
          value: "svc-092"
        - name: SERVICE_NAME
          value: "Feature-Store-Reader"
        - name: PORT
          value: "8092"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8092
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8092
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: feature-store-reader
  namespace: self-healing-ecosystem
  labels:
    app: feature-store-reader
spec:
  type: ClusterIP
  ports:
  - port: 8092
    targetPort: 8092
    protocol: TCP
    name: http
  selector:
    app: feature-store-reader
