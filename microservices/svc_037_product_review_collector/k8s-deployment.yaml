apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-review-collector
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: product-review-collector
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-037
spec:
  replicas: 3
  selector:
    matchLabels:
      app: product-review-collector
  template:
    metadata:
      labels:
        app: product-review-collector
        tier: middleware
        service-id: svc-037
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8037"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-05
      containers:
      - name: product-review-collector
        image: selfhealing/product-review-collector:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8037
          name: http
        resources:
          requests:
            cpu: "200m"
            memory: "350Mi"
          limits:
            cpu: "1000m"
            memory: "875Mi"
        env:
        - name: SERVICE_ID
          value: "svc-037"
        - name: SERVICE_NAME
          value: "Product-Review-Collector"
        - name: PORT
          value: "8037"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8037
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8037
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: product-review-collector
  namespace: self-healing-ecosystem
  labels:
    app: product-review-collector
spec:
  type: ClusterIP
  ports:
  - port: 8037
    targetPort: 8037
    protocol: TCP
    name: http
  selector:
    app: product-review-collector
