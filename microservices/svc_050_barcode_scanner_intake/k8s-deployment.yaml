apiVersion: apps/v1
kind: Deployment
metadata:
  name: barcode-scanner-intake
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: barcode-scanner-intake
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-050
spec:
  replicas: 3
  selector:
    matchLabels:
      app: barcode-scanner-intake
  template:
    metadata:
      labels:
        app: barcode-scanner-intake
        tier: middleware
        service-id: svc-050
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8050"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-02
      containers:
      - name: barcode-scanner-intake
        image: selfhealing/barcode-scanner-intake:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8050
          name: http
        resources:
          requests:
            cpu: "150m"
            memory: "260Mi"
          limits:
            cpu: "1000m"
            memory: "650Mi"
        env:
        - name: SERVICE_ID
          value: "svc-050"
        - name: SERVICE_NAME
          value: "Barcode-Scanner-Intake"
        - name: PORT
          value: "8050"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8050
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8050
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: barcode-scanner-intake
  namespace: self-healing-ecosystem
  labels:
    app: barcode-scanner-intake
spec:
  type: ClusterIP
  ports:
  - port: 8050
    targetPort: 8050
    protocol: TCP
    name: http
  selector:
    app: barcode-scanner-intake
