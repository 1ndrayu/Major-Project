apiVersion: apps/v1
kind: Deployment
metadata:
  name: package-tracking-engine
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: package-tracking-engine
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-048
spec:
  replicas: 3
  selector:
    matchLabels:
      app: package-tracking-engine
  template:
    metadata:
      labels:
        app: package-tracking-engine
        tier: middleware
        service-id: svc-048
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8048"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-08
      containers:
      - name: package-tracking-engine
        image: selfhealing/package-tracking-engine:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8048
          name: http
        resources:
          requests:
            cpu: "200m"
            memory: "350Mi"
          limits:
            cpu: "1000m"
            memory: "875Mi"
        env:
        - name: SERVICE_ID
          value: "svc-048"
        - name: SERVICE_NAME
          value: "Package-Tracking-Engine"
        - name: PORT
          value: "8048"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8048
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8048
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: package-tracking-engine
  namespace: self-healing-ecosystem
  labels:
    app: package-tracking-engine
spec:
  type: ClusterIP
  ports:
  - port: 8048
    targetPort: 8048
    protocol: TCP
    name: http
  selector:
    app: package-tracking-engine
