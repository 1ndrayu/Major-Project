apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-mesh-injector-bridge
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: chaos-mesh-injector-bridge
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: analytics
    service-id: svc-097
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chaos-mesh-injector-bridge
  template:
    metadata:
      labels:
        app: chaos-mesh-injector-bridge
        tier: analytics
        service-id: svc-097
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8097"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01
      containers:
      - name: chaos-mesh-injector-bridge
        image: selfhealing/chaos-mesh-injector-bridge:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8097
          name: http
        resources:
          requests:
            cpu: "140m"
            memory: "260Mi"
          limits:
            cpu: "1000m"
            memory: "650Mi"
        env:
        - name: SERVICE_ID
          value: "svc-097"
        - name: SERVICE_NAME
          value: "Chaos-Mesh-Injector-Bridge"
        - name: PORT
          value: "8097"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8097
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8097
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-mesh-injector-bridge
  namespace: self-healing-ecosystem
  labels:
    app: chaos-mesh-injector-bridge
spec:
  type: ClusterIP
  ports:
  - port: 8097
    targetPort: 8097
    protocol: TCP
    name: http
  selector:
    app: chaos-mesh-injector-bridge
