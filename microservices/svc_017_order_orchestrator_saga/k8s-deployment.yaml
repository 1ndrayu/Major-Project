apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-orchestrator-saga
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: order-orchestrator-saga
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-017
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-orchestrator-saga
  template:
    metadata:
      labels:
        app: order-orchestrator-saga
        tier: order_payment
        service-id: svc-017
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8017"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01
      containers:
      - name: order-orchestrator-saga
        image: selfhealing/order-orchestrator-saga:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8017
          name: http
        resources:
          requests:
            cpu: "400m"
            memory: "750Mi"
          limits:
            cpu: "1000m"
            memory: "1875Mi"
        env:
        - name: SERVICE_ID
          value: "svc-017"
        - name: SERVICE_NAME
          value: "Order-Orchestrator-Saga"
        - name: PORT
          value: "8017"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8017
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8017
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-orchestrator-saga
  namespace: self-healing-ecosystem
  labels:
    app: order-orchestrator-saga
spec:
  type: ClusterIP
  ports:
  - port: 8017
    targetPort: 8017
    protocol: TCP
    name: http
  selector:
    app: order-orchestrator-saga
