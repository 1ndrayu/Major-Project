apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-personalization-engine
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: user-personalization-engine
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-045
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-personalization-engine
  template:
    metadata:
      labels:
        app: user-personalization-engine
        tier: middleware
        service-id: svc-045
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8045"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-05
      containers:
      - name: user-personalization-engine
        image: selfhealing/user-personalization-engine:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8045
          name: http
        resources:
          requests:
            cpu: "350m"
            memory: "690Mi"
          limits:
            cpu: "1000m"
            memory: "1725Mi"
        env:
        - name: SERVICE_ID
          value: "svc-045"
        - name: SERVICE_NAME
          value: "User-Personalization-Engine"
        - name: PORT
          value: "8045"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8045
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8045
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-personalization-engine
  namespace: self-healing-ecosystem
  labels:
    app: user-personalization-engine
spec:
  type: ClusterIP
  ports:
  - port: 8045
    targetPort: 8045
    protocol: TCP
    name: http
  selector:
    app: user-personalization-engine
