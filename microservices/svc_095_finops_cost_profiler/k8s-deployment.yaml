apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-cost-profiler
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: finops-cost-profiler
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: analytics
    service-id: svc-095
spec:
  replicas: 3
  selector:
    matchLabels:
      app: finops-cost-profiler
  template:
    metadata:
      labels:
        app: finops-cost-profiler
        tier: analytics
        service-id: svc-095
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8095"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-07
      containers:
      - name: finops-cost-profiler
        image: selfhealing/finops-cost-profiler:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8095
          name: http
        resources:
          requests:
            cpu: "180m"
            memory: "330Mi"
          limits:
            cpu: "1000m"
            memory: "825Mi"
        env:
        - name: SERVICE_ID
          value: "svc-095"
        - name: SERVICE_NAME
          value: "FinOps-Cost-Profiler"
        - name: PORT
          value: "8095"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8095
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8095
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: finops-cost-profiler
  namespace: self-healing-ecosystem
  labels:
    app: finops-cost-profiler
spec:
  type: ClusterIP
  ports:
  - port: 8095
    targetPort: 8095
    protocol: TCP
    name: http
  selector:
    app: finops-cost-profiler
