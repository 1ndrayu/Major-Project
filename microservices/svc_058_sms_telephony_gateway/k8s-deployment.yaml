apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-telephony-gateway
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: sms-telephony-gateway
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: messaging
    service-id: svc-058
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sms-telephony-gateway
  template:
    metadata:
      labels:
        app: sms-telephony-gateway
        tier: messaging
        service-id: svc-058
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8058"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-02
      containers:
      - name: sms-telephony-gateway
        image: selfhealing/sms-telephony-gateway:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8058
          name: http
        resources:
          requests:
            cpu: "180m"
            memory: "310Mi"
          limits:
            cpu: "1000m"
            memory: "775Mi"
        env:
        - name: SERVICE_ID
          value: "svc-058"
        - name: SERVICE_NAME
          value: "SMS-Telephony-Gateway"
        - name: PORT
          value: "8058"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8058
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8058
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sms-telephony-gateway
  namespace: self-healing-ecosystem
  labels:
    app: sms-telephony-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8058
    targetPort: 8058
    protocol: TCP
    name: http
  selector:
    app: sms-telephony-gateway
