apiVersion: apps/v1
kind: Deployment
metadata:
  name: carrier-partner-gateway
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: carrier-partner-gateway
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-047
spec:
  replicas: 3
  selector:
    matchLabels:
      app: carrier-partner-gateway
  template:
    metadata:
      labels:
        app: carrier-partner-gateway
        tier: middleware
        service-id: svc-047
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8047"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-07
      containers:
      - name: carrier-partner-gateway
        image: selfhealing/carrier-partner-gateway:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8047
          name: http
        resources:
          requests:
            cpu: "240m"
            memory: "410Mi"
          limits:
            cpu: "1000m"
            memory: "1025Mi"
        env:
        - name: SERVICE_ID
          value: "svc-047"
        - name: SERVICE_NAME
          value: "Carrier-Partner-Gateway"
        - name: PORT
          value: "8047"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8047
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8047
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: carrier-partner-gateway
  namespace: self-healing-ecosystem
  labels:
    app: carrier-partner-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8047
    targetPort: 8047
    protocol: TCP
    name: http
  selector:
    app: carrier-partner-gateway
