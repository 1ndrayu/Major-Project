apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-facet-filter
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: catalog-facet-filter
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-036
spec:
  replicas: 3
  selector:
    matchLabels:
      app: catalog-facet-filter
  template:
    metadata:
      labels:
        app: catalog-facet-filter
        tier: middleware
        service-id: svc-036
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8036"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-04
      containers:
      - name: catalog-facet-filter
        image: selfhealing/catalog-facet-filter:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8036
          name: http
        resources:
          requests:
            cpu: "280m"
            memory: "490Mi"
          limits:
            cpu: "1000m"
            memory: "1225Mi"
        env:
        - name: SERVICE_ID
          value: "svc-036"
        - name: SERVICE_NAME
          value: "Catalog-Facet-Filter"
        - name: PORT
          value: "8036"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8036
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8036
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-facet-filter
  namespace: self-healing-ecosystem
  labels:
    app: catalog-facet-filter
spec:
  type: ClusterIP
  ports:
  - port: 8036
    targetPort: 8036
    protocol: TCP
    name: http
  selector:
    app: catalog-facet-filter
