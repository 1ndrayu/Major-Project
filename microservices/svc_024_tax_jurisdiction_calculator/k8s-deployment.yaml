apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-jurisdiction-calculator
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: tax-jurisdiction-calculator
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-024
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tax-jurisdiction-calculator
  template:
    metadata:
      labels:
        app: tax-jurisdiction-calculator
        tier: order_payment
        service-id: svc-024
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8024"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-08
      containers:
      - name: tax-jurisdiction-calculator
        image: selfhealing/tax-jurisdiction-calculator:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8024
          name: http
        resources:
          requests:
            cpu: "200m"
            memory: "360Mi"
          limits:
            cpu: "1000m"
            memory: "900Mi"
        env:
        - name: SERVICE_ID
          value: "svc-024"
        - name: SERVICE_NAME
          value: "Tax-Jurisdiction-Calculator"
        - name: PORT
          value: "8024"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8024
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8024
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tax-jurisdiction-calculator
  namespace: self-healing-ecosystem
  labels:
    app: tax-jurisdiction-calculator
spec:
  type: ClusterIP
  ports:
  - port: 8024
    targetPort: 8024
    protocol: TCP
    name: http
  selector:
    app: tax-jurisdiction-calculator
