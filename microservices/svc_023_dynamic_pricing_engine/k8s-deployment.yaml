apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-pricing-engine
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: dynamic-pricing-engine
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-023
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dynamic-pricing-engine
  template:
    metadata:
      labels:
        app: dynamic-pricing-engine
        tier: order_payment
        service-id: svc-023
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8023"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-07
      containers:
      - name: dynamic-pricing-engine
        image: selfhealing/dynamic-pricing-engine:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8023
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "430Mi"
          limits:
            cpu: "1000m"
            memory: "1075Mi"
        env:
        - name: SERVICE_ID
          value: "svc-023"
        - name: SERVICE_NAME
          value: "Dynamic-Pricing-Engine"
        - name: PORT
          value: "8023"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8023
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8023
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dynamic-pricing-engine
  namespace: self-healing-ecosystem
  labels:
    app: dynamic-pricing-engine
spec:
  type: ClusterIP
  ports:
  - port: 8023
    targetPort: 8023
    protocol: TCP
    name: http
  selector:
    app: dynamic-pricing-engine
