apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-identity-directory
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: user-identity-directory
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-013
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-identity-directory
  template:
    metadata:
      labels:
        app: user-identity-directory
        tier: middleware
        service-id: svc-013
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8013"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-05
      containers:
      - name: user-identity-directory
        image: selfhealing/user-identity-directory:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8013
          name: http
        resources:
          requests:
            cpu: "260m"
            memory: "420Mi"
          limits:
            cpu: "1000m"
            memory: "1050Mi"
        env:
        - name: SERVICE_ID
          value: "svc-013"
        - name: SERVICE_NAME
          value: "User-Identity-Directory"
        - name: PORT
          value: "8013"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8013
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8013
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-identity-directory
  namespace: self-healing-ecosystem
  labels:
    app: user-identity-directory
spec:
  type: ClusterIP
  ports:
  - port: 8013
    targetPort: 8013
    protocol: TCP
    name: http
  selector:
    app: user-identity-directory
