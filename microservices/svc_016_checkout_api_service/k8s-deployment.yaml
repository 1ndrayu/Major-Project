apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api-service
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: checkout-api-service
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-016
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout-api-service
  template:
    metadata:
      labels:
        app: checkout-api-service
        tier: order_payment
        service-id: svc-016
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8016"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-08
      containers:
      - name: checkout-api-service
        image: selfhealing/checkout-api-service:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8016
          name: http
        resources:
          requests:
            cpu: "350m"
            memory: "680Mi"
          limits:
            cpu: "1000m"
            memory: "1700Mi"
        env:
        - name: SERVICE_ID
          value: "svc-016"
        - name: SERVICE_NAME
          value: "Checkout-API-Service"
        - name: PORT
          value: "8016"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8016
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8016
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api-service
  namespace: self-healing-ecosystem
  labels:
    app: checkout-api-service
spec:
  type: ClusterIP
  ports:
  - port: 8016
    targetPort: 8016
    protocol: TCP
    name: http
  selector:
    app: checkout-api-service
