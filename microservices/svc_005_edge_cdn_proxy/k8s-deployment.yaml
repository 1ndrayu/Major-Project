apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-cdn-proxy
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: edge-cdn-proxy
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: frontend
    service-id: svc-005
spec:
  replicas: 5
  selector:
    matchLabels:
      app: edge-cdn-proxy
  template:
    metadata:
      labels:
        app: edge-cdn-proxy
        tier: frontend
        service-id: svc-005
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-05
      containers:
      - name: edge-cdn-proxy
        image: selfhealing/edge-cdn-proxy:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8005
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "380Mi"
          limits:
            cpu: "1000m"
            memory: "950Mi"
        env:
        - name: SERVICE_ID
          value: "svc-005"
        - name: SERVICE_NAME
          value: "Edge-CDN-Proxy"
        - name: PORT
          value: "8005"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8005
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8005
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: edge-cdn-proxy
  namespace: self-healing-ecosystem
  labels:
    app: edge-cdn-proxy
spec:
  type: ClusterIP
  ports:
  - port: 8005
    targetPort: 8005
    protocol: TCP
    name: http
  selector:
    app: edge-cdn-proxy
