apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-webhook-invoker
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: partner-webhook-invoker
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: messaging
    service-id: svc-064
spec:
  replicas: 3
  selector:
    matchLabels:
      app: partner-webhook-invoker
  template:
    metadata:
      labels:
        app: partner-webhook-invoker
        tier: messaging
        service-id: svc-064
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8064"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-08
      containers:
      - name: partner-webhook-invoker
        image: selfhealing/partner-webhook-invoker:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8064
          name: http
        resources:
          requests:
            cpu: "230m"
            memory: "390Mi"
          limits:
            cpu: "1000m"
            memory: "975Mi"
        env:
        - name: SERVICE_ID
          value: "svc-064"
        - name: SERVICE_NAME
          value: "Partner-Webhook-Invoker"
        - name: PORT
          value: "8064"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8064
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8064
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: partner-webhook-invoker
  namespace: self-healing-ecosystem
  labels:
    app: partner-webhook-invoker
spec:
  type: ClusterIP
  ports:
  - port: 8064
    targetPort: 8064
    protocol: TCP
    name: http
  selector:
    app: partner-webhook-invoker
