apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer-dispatcher
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: kafka-consumer-dispatcher
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: messaging
    service-id: svc-062
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kafka-consumer-dispatcher
  template:
    metadata:
      labels:
        app: kafka-consumer-dispatcher
        tier: messaging
        service-id: svc-062
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8062"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-06
      containers:
      - name: kafka-consumer-dispatcher
        image: selfhealing/kafka-consumer-dispatcher:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8062
          name: http
        resources:
          requests:
            cpu: "320m"
            memory: "580Mi"
          limits:
            cpu: "1000m"
            memory: "1450Mi"
        env:
        - name: SERVICE_ID
          value: "svc-062"
        - name: SERVICE_NAME
          value: "Kafka-Consumer-Dispatcher"
        - name: PORT
          value: "8062"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8062
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8062
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-consumer-dispatcher
  namespace: self-healing-ecosystem
  labels:
    app: kafka-consumer-dispatcher
spec:
  type: ClusterIP
  ports:
  - port: 8062
    targetPort: 8062
    protocol: TCP
    name: http
  selector:
    app: kafka-consumer-dispatcher
