apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-ml-scoring-worker
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: fraud-ml-scoring-worker
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: analytics
    service-id: svc-094
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fraud-ml-scoring-worker
  template:
    metadata:
      labels:
        app: fraud-ml-scoring-worker
        tier: analytics
        service-id: svc-094
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8094"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-06
      containers:
      - name: fraud-ml-scoring-worker
        image: selfhealing/fraud-ml-scoring-worker:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8094
          name: http
        resources:
          requests:
            cpu: "440m"
            memory: "890Mi"
          limits:
            cpu: "1000m"
            memory: "2225Mi"
        env:
        - name: SERVICE_ID
          value: "svc-094"
        - name: SERVICE_NAME
          value: "Fraud-ML-Scoring-Worker"
        - name: PORT
          value: "8094"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8094
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8094
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-ml-scoring-worker
  namespace: self-healing-ecosystem
  labels:
    app: fraud-ml-scoring-worker
spec:
  type: ClusterIP
  ports:
  - port: 8094
    targetPort: 8094
    protocol: TCP
    name: http
  selector:
    app: fraud-ml-scoring-worker
