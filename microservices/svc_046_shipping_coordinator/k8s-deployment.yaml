apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-coordinator
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: shipping-coordinator
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-046
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shipping-coordinator
  template:
    metadata:
      labels:
        app: shipping-coordinator
        tier: middleware
        service-id: svc-046
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8046"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-06
      containers:
      - name: shipping-coordinator
        image: selfhealing/shipping-coordinator:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8046
          name: http
        resources:
          requests:
            cpu: "220m"
            memory: "380Mi"
          limits:
            cpu: "1000m"
            memory: "950Mi"
        env:
        - name: SERVICE_ID
          value: "svc-046"
        - name: SERVICE_NAME
          value: "Shipping-Coordinator"
        - name: PORT
          value: "8046"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8046
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8046
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-coordinator
  namespace: self-healing-ecosystem
  labels:
    app: shipping-coordinator
spec:
  type: ClusterIP
  ports:
  - port: 8046
    targetPort: 8046
    protocol: TCP
    name: http
  selector:
    app: shipping-coordinator
