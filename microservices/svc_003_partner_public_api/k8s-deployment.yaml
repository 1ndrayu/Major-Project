apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-public-api
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: partner-public-api
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: frontend
    service-id: svc-003
spec:
  replicas: 5
  selector:
    matchLabels:
      app: partner-public-api
  template:
    metadata:
      labels:
        app: partner-public-api
        tier: frontend
        service-id: svc-003
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-03
      containers:
      - name: partner-public-api
        image: selfhealing/partner-public-api:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8003
          name: http
        resources:
          requests:
            cpu: "150m"
            memory: "280Mi"
          limits:
            cpu: "1000m"
            memory: "700Mi"
        env:
        - name: SERVICE_ID
          value: "svc-003"
        - name: SERVICE_NAME
          value: "Partner-Public-API"
        - name: PORT
          value: "8003"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: partner-public-api
  namespace: self-healing-ecosystem
  labels:
    app: partner-public-api
spec:
  type: ClusterIP
  ports:
  - port: 8003
    targetPort: 8003
    protocol: TCP
    name: http
  selector:
    app: partner-public-api
