apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-cassandra-cluster
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: audit-cassandra-cluster
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-078
spec:
  replicas: 3
  selector:
    matchLabels:
      app: audit-cassandra-cluster
  template:
    metadata:
      labels:
        app: audit-cassandra-cluster
        tier: database
        service-id: svc-078
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8078"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-06
      containers:
      - name: audit-cassandra-cluster
        image: selfhealing/audit-cassandra-cluster:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8078
          name: http
        resources:
          requests:
            cpu: "330m"
            memory: "680Mi"
          limits:
            cpu: "1000m"
            memory: "1700Mi"
        env:
        - name: SERVICE_ID
          value: "svc-078"
        - name: SERVICE_NAME
          value: "Audit-Cassandra-Cluster"
        - name: PORT
          value: "8078"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '40'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8078
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8078
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: audit-cassandra-cluster
  namespace: self-healing-ecosystem
  labels:
    app: audit-cassandra-cluster
spec:
  type: ClusterIP
  ports:
  - port: 8078
    targetPort: 8078
    protocol: TCP
    name: http
  selector:
    app: audit-cassandra-cluster
