apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-rules
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: fraud-detection-rules
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-022
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fraud-detection-rules
  template:
    metadata:
      labels:
        app: fraud-detection-rules
        tier: order_payment
        service-id: svc-022
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8022"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-06
      containers:
      - name: fraud-detection-rules
        image: selfhealing/fraud-detection-rules:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8022
          name: http
        resources:
          requests:
            cpu: "420m"
            memory: "820Mi"
          limits:
            cpu: "1000m"
            memory: "2050Mi"
        env:
        - name: SERVICE_ID
          value: "svc-022"
        - name: SERVICE_NAME
          value: "Fraud-Detection-Rules"
        - name: PORT
          value: "8022"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8022
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8022
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-rules
  namespace: self-healing-ecosystem
  labels:
    app: fraud-detection-rules
spec:
  type: ClusterIP
  ports:
  - port: 8022
    targetPort: 8022
    protocol: TCP
    name: http
  selector:
    app: fraud-detection-rules
