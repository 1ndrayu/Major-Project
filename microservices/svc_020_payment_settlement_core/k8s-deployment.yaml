apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-settlement-core
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: payment-settlement-core
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-020
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-settlement-core
  template:
    metadata:
      labels:
        app: payment-settlement-core
        tier: order_payment
        service-id: svc-020
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8020"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-04
      containers:
      - name: payment-settlement-core
        image: selfhealing/payment-settlement-core:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8020
          name: http
        resources:
          requests:
            cpu: "300m"
            memory: "620Mi"
          limits:
            cpu: "1000m"
            memory: "1550Mi"
        env:
        - name: SERVICE_ID
          value: "svc-020"
        - name: SERVICE_NAME
          value: "Payment-Settlement-Core"
        - name: PORT
          value: "8020"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8020
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8020
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-settlement-core
  namespace: self-healing-ecosystem
  labels:
    app: payment-settlement-core
spec:
  type: ClusterIP
  ports:
  - port: 8020
    targetPort: 8020
    protocol: TCP
    name: http
  selector:
    app: payment-settlement-core
