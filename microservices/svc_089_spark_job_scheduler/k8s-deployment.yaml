apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-job-scheduler
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: spark-job-scheduler
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: analytics
    service-id: svc-089
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spark-job-scheduler
  template:
    metadata:
      labels:
        app: spark-job-scheduler
        tier: analytics
        service-id: svc-089
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8089"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01
      containers:
      - name: spark-job-scheduler
        image: selfhealing/spark-job-scheduler:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8089
          name: http
        resources:
          requests:
            cpu: "220m"
            memory: "430Mi"
          limits:
            cpu: "1000m"
            memory: "1075Mi"
        env:
        - name: SERVICE_ID
          value: "svc-089"
        - name: SERVICE_NAME
          value: "Spark-Job-Scheduler"
        - name: PORT
          value: "8089"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8089
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8089
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: spark-job-scheduler
  namespace: self-healing-ecosystem
  labels:
    app: spark-job-scheduler
spec:
  type: ClusterIP
  ports:
  - port: 8089
    targetPort: 8089
    protocol: TCP
    name: http
  selector:
    app: spark-job-scheduler
