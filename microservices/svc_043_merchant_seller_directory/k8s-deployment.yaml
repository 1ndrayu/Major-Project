apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-seller-directory
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: merchant-seller-directory
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-043
spec:
  replicas: 3
  selector:
    matchLabels:
      app: merchant-seller-directory
  template:
    metadata:
      labels:
        app: merchant-seller-directory
        tier: middleware
        service-id: svc-043
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8043"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-03
      containers:
      - name: merchant-seller-directory
        image: selfhealing/merchant-seller-directory:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8043
          name: http
        resources:
          requests:
            cpu: "190m"
            memory: "330Mi"
          limits:
            cpu: "1000m"
            memory: "825Mi"
        env:
        - name: SERVICE_ID
          value: "svc-043"
        - name: SERVICE_NAME
          value: "Merchant-Seller-Directory"
        - name: PORT
          value: "8043"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8043
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8043
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-seller-directory
  namespace: self-healing-ecosystem
  labels:
    app: merchant-seller-directory
spec:
  type: ClusterIP
  ports:
  - port: 8043
    targetPort: 8043
    protocol: TCP
    name: http
  selector:
    app: merchant-seller-directory
