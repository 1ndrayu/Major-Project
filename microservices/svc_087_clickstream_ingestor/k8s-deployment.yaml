apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickstream-ingestor
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: clickstream-ingestor
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: analytics
    service-id: svc-087
spec:
  replicas: 3
  selector:
    matchLabels:
      app: clickstream-ingestor
  template:
    metadata:
      labels:
        app: clickstream-ingestor
        tier: analytics
        service-id: svc-087
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8087"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-07
      containers:
      - name: clickstream-ingestor
        image: selfhealing/clickstream-ingestor:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8087
          name: http
        resources:
          requests:
            cpu: "320m"
            memory: "610Mi"
          limits:
            cpu: "1000m"
            memory: "1525Mi"
        env:
        - name: SERVICE_ID
          value: "svc-087"
        - name: SERVICE_NAME
          value: "Clickstream-Ingestor"
        - name: PORT
          value: "8087"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8087
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8087
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: clickstream-ingestor
  namespace: self-healing-ecosystem
  labels:
    app: clickstream-ingestor
spec:
  type: ClusterIP
  ports:
  - port: 8087
    targetPort: 8087
    protocol: TCP
    name: http
  selector:
    app: clickstream-ingestor
