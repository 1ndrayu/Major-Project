apiVersion: apps/v1
kind: Deployment
metadata:
  name: postal-address-validator
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: postal-address-validator
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-054
spec:
  replicas: 3
  selector:
    matchLabels:
      app: postal-address-validator
  template:
    metadata:
      labels:
        app: postal-address-validator
        tier: middleware
        service-id: svc-054
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8054"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-06
      containers:
      - name: postal-address-validator
        image: selfhealing/postal-address-validator:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8054
          name: http
        resources:
          requests:
            cpu: "170m"
            memory: "300Mi"
          limits:
            cpu: "1000m"
            memory: "750Mi"
        env:
        - name: SERVICE_ID
          value: "svc-054"
        - name: SERVICE_NAME
          value: "Postal-Address-Validator"
        - name: PORT
          value: "8054"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8054
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8054
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postal-address-validator
  namespace: self-healing-ecosystem
  labels:
    app: postal-address-validator
spec:
  type: ClusterIP
  ports:
  - port: 8054
    targetPort: 8054
    protocol: TCP
    name: http
  selector:
    app: postal-address-validator
