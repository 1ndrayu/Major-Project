apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-token-validator
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: auth-token-validator
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-011
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth-token-validator
  template:
    metadata:
      labels:
        app: auth-token-validator
        tier: middleware
        service-id: svc-011
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8011"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-03
      containers:
      - name: auth-token-validator
        image: selfhealing/auth-token-validator:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8011
          name: http
        resources:
          requests:
            cpu: "200m"
            memory: "320Mi"
          limits:
            cpu: "1000m"
            memory: "800Mi"
        env:
        - name: SERVICE_ID
          value: "svc-011"
        - name: SERVICE_NAME
          value: "Auth-Token-Validator"
        - name: PORT
          value: "8011"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8011
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8011
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-token-validator
  namespace: self-healing-ecosystem
  labels:
    app: auth-token-validator
spec:
  type: ClusterIP
  ports:
  - port: 8011
    targetPort: 8011
    protocol: TCP
    name: http
  selector:
    app: auth-token-validator
