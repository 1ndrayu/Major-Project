apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-portal-ui
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: admin-portal-ui
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: frontend
    service-id: svc-004
spec:
  replicas: 5
  selector:
    matchLabels:
      app: admin-portal-ui
  template:
    metadata:
      labels:
        app: admin-portal-ui
        tier: frontend
        service-id: svc-004
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-04
      containers:
      - name: admin-portal-ui
        image: selfhealing/admin-portal-ui:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8004
          name: http
        resources:
          requests:
            cpu: "120m"
            memory: "220Mi"
          limits:
            cpu: "1000m"
            memory: "550Mi"
        env:
        - name: SERVICE_ID
          value: "svc-004"
        - name: SERVICE_NAME
          value: "Admin-Portal-UI"
        - name: PORT
          value: "8004"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8004
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: admin-portal-ui
  namespace: self-healing-ecosystem
  labels:
    app: admin-portal-ui
spec:
  type: ClusterIP
  ports:
  - port: 8004
    targetPort: 8004
    protocol: TCP
    name: http
  selector:
    app: admin-portal-ui
