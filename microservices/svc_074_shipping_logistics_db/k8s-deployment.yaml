apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-logistics-db
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: shipping-logistics-db
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-074
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shipping-logistics-db
  template:
    metadata:
      labels:
        app: shipping-logistics-db
        tier: database
        service-id: svc-074
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8074"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-02
      containers:
      - name: shipping-logistics-db
        image: selfhealing/shipping-logistics-db:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8074
          name: http
        resources:
          requests:
            cpu: "240m"
            memory: "460Mi"
          limits:
            cpu: "1000m"
            memory: "1150Mi"
        env:
        - name: SERVICE_ID
          value: "svc-074"
        - name: SERVICE_NAME
          value: "Shipping-Logistics-DB"
        - name: PORT
          value: "8074"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '35'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8074
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8074
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-logistics-db
  namespace: self-healing-ecosystem
  labels:
    app: shipping-logistics-db
spec:
  type: ClusterIP
  ports:
  - port: 8074
    targetPort: 8074
    protocol: TCP
    name: http
  selector:
    app: shipping-logistics-db
