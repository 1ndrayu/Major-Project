apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-workflow-coordinator
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: etl-workflow-coordinator
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: analytics
    service-id: svc-088
spec:
  replicas: 3
  selector:
    matchLabels:
      app: etl-workflow-coordinator
  template:
    metadata:
      labels:
        app: etl-workflow-coordinator
        tier: analytics
        service-id: svc-088
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8088"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-08
      containers:
      - name: etl-workflow-coordinator
        image: selfhealing/etl-workflow-coordinator:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8088
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "480Mi"
          limits:
            cpu: "1000m"
            memory: "1200Mi"
        env:
        - name: SERVICE_ID
          value: "svc-088"
        - name: SERVICE_NAME
          value: "ETL-Workflow-Coordinator"
        - name: PORT
          value: "8088"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8088
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8088
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: etl-workflow-coordinator
  namespace: self-healing-ecosystem
  labels:
    app: etl-workflow-coordinator
spec:
  type: ClusterIP
  ports:
  - port: 8088
    targetPort: 8088
    protocol: TCP
    name: http
  selector:
    app: etl-workflow-coordinator
