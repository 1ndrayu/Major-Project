apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-dispatcher
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: notification-dispatcher
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: messaging
    service-id: svc-056
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-dispatcher
  template:
    metadata:
      labels:
        app: notification-dispatcher
        tier: messaging
        service-id: svc-056
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8056"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-08
      containers:
      - name: notification-dispatcher
        image: selfhealing/notification-dispatcher:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8056
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "420Mi"
          limits:
            cpu: "1000m"
            memory: "1050Mi"
        env:
        - name: SERVICE_ID
          value: "svc-056"
        - name: SERVICE_NAME
          value: "Notification-Dispatcher"
        - name: PORT
          value: "8056"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8056
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8056
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-dispatcher
  namespace: self-healing-ecosystem
  labels:
    app: notification-dispatcher
spec:
  type: ClusterIP
  ports:
  - port: 8056
    targetPort: 8056
    protocol: TCP
    name: http
  selector:
    app: notification-dispatcher
