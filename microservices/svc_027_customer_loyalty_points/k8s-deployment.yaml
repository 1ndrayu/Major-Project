apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-loyalty-points
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: customer-loyalty-points
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-027
spec:
  replicas: 3
  selector:
    matchLabels:
      app: customer-loyalty-points
  template:
    metadata:
      labels:
        app: customer-loyalty-points
        tier: order_payment
        service-id: svc-027
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8027"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-03
      containers:
      - name: customer-loyalty-points
        image: selfhealing/customer-loyalty-points:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8027
          name: http
        resources:
          requests:
            cpu: "170m"
            memory: "290Mi"
          limits:
            cpu: "1000m"
            memory: "725Mi"
        env:
        - name: SERVICE_ID
          value: "svc-027"
        - name: SERVICE_NAME
          value: "Customer-Loyalty-Points"
        - name: PORT
          value: "8027"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8027
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8027
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: customer-loyalty-points
  namespace: self-healing-ecosystem
  labels:
    app: customer-loyalty-points
spec:
  type: ClusterIP
  ports:
  - port: 8027
    targetPort: 8027
    protocol: TCP
    name: http
  selector:
    app: customer-loyalty-points
