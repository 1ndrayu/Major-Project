apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-prometheus-store
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: telemetry-prometheus-store
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-085
spec:
  replicas: 3
  selector:
    matchLabels:
      app: telemetry-prometheus-store
  template:
    metadata:
      labels:
        app: telemetry-prometheus-store
        tier: database
        service-id: svc-085
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-05
      containers:
      - name: telemetry-prometheus-store
        image: selfhealing/telemetry-prometheus-store:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8085
          name: http
        resources:
          requests:
            cpu: "370m"
            memory: "710Mi"
          limits:
            cpu: "1000m"
            memory: "1775Mi"
        env:
        - name: SERVICE_ID
          value: "svc-085"
        - name: SERVICE_NAME
          value: "Telemetry-Prometheus-Store"
        - name: PORT
          value: "8085"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '35'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8085
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8085
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-prometheus-store
  namespace: self-healing-ecosystem
  labels:
    app: telemetry-prometheus-store
spec:
  type: ClusterIP
  ports:
  - port: 8085
    targetPort: 8085
    protocol: TCP
    name: http
  selector:
    app: telemetry-prometheus-store
