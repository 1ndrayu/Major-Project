apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-churn-prediction-worker
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: user-churn-prediction-worker
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: analytics
    service-id: svc-093
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-churn-prediction-worker
  template:
    metadata:
      labels:
        app: user-churn-prediction-worker
        tier: analytics
        service-id: svc-093
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8093"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-05
      containers:
      - name: user-churn-prediction-worker
        image: selfhealing/user-churn-prediction-worker:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8093
          name: http
        resources:
          requests:
            cpu: "260m"
            memory: "490Mi"
          limits:
            cpu: "1000m"
            memory: "1225Mi"
        env:
        - name: SERVICE_ID
          value: "svc-093"
        - name: SERVICE_NAME
          value: "User-Churn-Prediction-Worker"
        - name: PORT
          value: "8093"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8093
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8093
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-churn-prediction-worker
  namespace: self-healing-ecosystem
  labels:
    app: user-churn-prediction-worker
spec:
  type: ClusterIP
  ports:
  - port: 8093
    targetPort: 8093
    protocol: TCP
    name: http
  selector:
    app: user-churn-prediction-worker
