apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-redis-cache-proxy
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: session-redis-cache-proxy
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-072
spec:
  replicas: 3
  selector:
    matchLabels:
      app: session-redis-cache-proxy
  template:
    metadata:
      labels:
        app: session-redis-cache-proxy
        tier: database
        service-id: svc-072
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8072"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-08
      containers:
      - name: session-redis-cache-proxy
        image: selfhealing/session-redis-cache-proxy:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8072
          name: http
        resources:
          requests:
            cpu: "180m"
            memory: "390Mi"
          limits:
            cpu: "1000m"
            memory: "975Mi"
        env:
        - name: SERVICE_ID
          value: "svc-072"
        - name: SERVICE_NAME
          value: "Session-Redis-Cache-Proxy"
        - name: PORT
          value: "8072"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '60'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8072
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8072
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: session-redis-cache-proxy
  namespace: self-healing-ecosystem
  labels:
    app: session-redis-cache-proxy
spec:
  type: ClusterIP
  ports:
  - port: 8072
    targetPort: 8072
    protocol: TCP
    name: http
  selector:
    app: session-redis-cache-proxy
