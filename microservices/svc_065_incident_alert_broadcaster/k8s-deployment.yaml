apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-alert-broadcaster
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: incident-alert-broadcaster
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: messaging
    service-id: svc-065
spec:
  replicas: 3
  selector:
    matchLabels:
      app: incident-alert-broadcaster
  template:
    metadata:
      labels:
        app: incident-alert-broadcaster
        tier: messaging
        service-id: svc-065
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8065"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01
      containers:
      - name: incident-alert-broadcaster
        image: selfhealing/incident-alert-broadcaster:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8065
          name: http
        resources:
          requests:
            cpu: "150m"
            memory: "270Mi"
          limits:
            cpu: "1000m"
            memory: "675Mi"
        env:
        - name: SERVICE_ID
          value: "svc-065"
        - name: SERVICE_NAME
          value: "Incident-Alert-Broadcaster"
        - name: PORT
          value: "8065"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8065
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8065
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: incident-alert-broadcaster
  namespace: self-healing-ecosystem
  labels:
    app: incident-alert-broadcaster
spec:
  type: ClusterIP
  ports:
  - port: 8065
    targetPort: 8065
    protocol: TCP
    name: http
  selector:
    app: incident-alert-broadcaster
