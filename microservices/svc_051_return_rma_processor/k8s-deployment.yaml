apiVersion: apps/v1
kind: Deployment
metadata:
  name: return-rma-processor
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: return-rma-processor
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-051
spec:
  replicas: 3
  selector:
    matchLabels:
      app: return-rma-processor
  template:
    metadata:
      labels:
        app: return-rma-processor
        tier: middleware
        service-id: svc-051
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8051"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-03
      containers:
      - name: return-rma-processor
        image: selfhealing/return-rma-processor:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8051
          name: http
        resources:
          requests:
            cpu: "180m"
            memory: "310Mi"
          limits:
            cpu: "1000m"
            memory: "775Mi"
        env:
        - name: SERVICE_ID
          value: "svc-051"
        - name: SERVICE_NAME
          value: "Return-RMA-Processor"
        - name: PORT
          value: "8051"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8051
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8051
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: return-rma-processor
  namespace: self-healing-ecosystem
  labels:
    app: return-rma-processor
spec:
  type: ClusterIP
  ports:
  - port: 8051
    targetPort: 8051
    protocol: TCP
    name: http
  selector:
    app: return-rma-processor
