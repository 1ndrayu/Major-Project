apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcm-push-notifier
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: fcm-push-notifier
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: messaging
    service-id: svc-057
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fcm-push-notifier
  template:
    metadata:
      labels:
        app: fcm-push-notifier
        tier: messaging
        service-id: svc-057
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8057"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01
      containers:
      - name: fcm-push-notifier
        image: selfhealing/fcm-push-notifier:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8057
          name: http
        resources:
          requests:
            cpu: "220m"
            memory: "380Mi"
          limits:
            cpu: "1000m"
            memory: "950Mi"
        env:
        - name: SERVICE_ID
          value: "svc-057"
        - name: SERVICE_NAME
          value: "FCM-Push-Notifier"
        - name: PORT
          value: "8057"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8057
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8057
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fcm-push-notifier
  namespace: self-healing-ecosystem
  labels:
    app: fcm-push-notifier
spec:
  type: ClusterIP
  ports:
  - port: 8057
    targetPort: 8057
    protocol: TCP
    name: http
  selector:
    app: fcm-push-notifier
