apiVersion: apps/v1
kind: Deployment
metadata:
  name: promo-coupon-validator
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: promo-coupon-validator
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-026
spec:
  replicas: 3
  selector:
    matchLabels:
      app: promo-coupon-validator
  template:
    metadata:
      labels:
        app: promo-coupon-validator
        tier: order_payment
        service-id: svc-026
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8026"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-02
      containers:
      - name: promo-coupon-validator
        image: selfhealing/promo-coupon-validator:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8026
          name: http
        resources:
          requests:
            cpu: "190m"
            memory: "310Mi"
          limits:
            cpu: "1000m"
            memory: "775Mi"
        env:
        - name: SERVICE_ID
          value: "svc-026"
        - name: SERVICE_NAME
          value: "Promo-Coupon-Validator"
        - name: PORT
          value: "8026"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8026
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8026
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: promo-coupon-validator
  namespace: self-healing-ecosystem
  labels:
    app: promo-coupon-validator
spec:
  type: ClusterIP
  ports:
  - port: 8026
    targetPort: 8026
    protocol: TCP
    name: http
  selector:
    app: promo-coupon-validator
