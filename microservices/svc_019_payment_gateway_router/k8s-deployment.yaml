apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway-router
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: payment-gateway-router
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-019
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-gateway-router
  template:
    metadata:
      labels:
        app: payment-gateway-router
        tier: order_payment
        service-id: svc-019
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8019"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-03
      containers:
      - name: payment-gateway-router
        image: selfhealing/payment-gateway-router:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8019
          name: http
        resources:
          requests:
            cpu: "320m"
            memory: "580Mi"
          limits:
            cpu: "1000m"
            memory: "1450Mi"
        env:
        - name: SERVICE_ID
          value: "svc-019"
        - name: SERVICE_NAME
          value: "Payment-Gateway-Router"
        - name: PORT
          value: "8019"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8019
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8019
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-gateway-router
  namespace: self-healing-ecosystem
  labels:
    app: payment-gateway-router
spec:
  type: ClusterIP
  ports:
  - port: 8019
    targetPort: 8019
    protocol: TCP
    name: http
  selector:
    app: payment-gateway-router
