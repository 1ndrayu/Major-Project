apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-fleet-telemetry
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: delivery-fleet-telemetry
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-052
spec:
  replicas: 3
  selector:
    matchLabels:
      app: delivery-fleet-telemetry
  template:
    metadata:
      labels:
        app: delivery-fleet-telemetry
        tier: middleware
        service-id: svc-052
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8052"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-04
      containers:
      - name: delivery-fleet-telemetry
        image: selfhealing/delivery-fleet-telemetry:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8052
          name: http
        resources:
          requests:
            cpu: "230m"
            memory: "400Mi"
          limits:
            cpu: "1000m"
            memory: "1000Mi"
        env:
        - name: SERVICE_ID
          value: "svc-052"
        - name: SERVICE_NAME
          value: "Delivery-Fleet-Telemetry"
        - name: PORT
          value: "8052"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8052
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8052
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-fleet-telemetry
  namespace: self-healing-ecosystem
  labels:
    app: delivery-fleet-telemetry
spec:
  type: ClusterIP
  ports:
  - port: 8052
    targetPort: 8052
    protocol: TCP
    name: http
  selector:
    app: delivery-fleet-telemetry
