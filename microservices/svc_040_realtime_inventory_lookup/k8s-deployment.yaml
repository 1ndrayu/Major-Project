apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-inventory-lookup
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: realtime-inventory-lookup
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-040
spec:
  replicas: 3
  selector:
    matchLabels:
      app: realtime-inventory-lookup
  template:
    metadata:
      labels:
        app: realtime-inventory-lookup
        tier: middleware
        service-id: svc-040
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8040"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-08
      containers:
      - name: realtime-inventory-lookup
        image: selfhealing/realtime-inventory-lookup:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8040
          name: http
        resources:
          requests:
            cpu: "320m"
            memory: "540Mi"
          limits:
            cpu: "1000m"
            memory: "1350Mi"
        env:
        - name: SERVICE_ID
          value: "svc-040"
        - name: SERVICE_NAME
          value: "Realtime-Inventory-Lookup"
        - name: PORT
          value: "8040"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8040
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8040
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-inventory-lookup
  namespace: self-healing-ecosystem
  labels:
    app: realtime-inventory-lookup
spec:
  type: ClusterIP
  ports:
  - port: 8040
    targetPort: 8040
    protocol: TCP
    name: http
  selector:
    app: realtime-inventory-lookup
