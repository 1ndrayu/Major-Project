apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-trace-collector-daemon
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: otel-trace-collector-daemon
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: analytics
    service-id: svc-098
spec:
  replicas: 3
  selector:
    matchLabels:
      app: otel-trace-collector-daemon
  template:
    metadata:
      labels:
        app: otel-trace-collector-daemon
        tier: analytics
        service-id: svc-098
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8098"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-02
      containers:
      - name: otel-trace-collector-daemon
        image: selfhealing/otel-trace-collector-daemon:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8098
          name: http
        resources:
          requests:
            cpu: "360m"
            memory: "680Mi"
          limits:
            cpu: "1000m"
            memory: "1700Mi"
        env:
        - name: SERVICE_ID
          value: "svc-098"
        - name: SERVICE_NAME
          value: "OTel-Trace-Collector-Daemon"
        - name: PORT
          value: "8098"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8098
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8098
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: otel-trace-collector-daemon
  namespace: self-healing-ecosystem
  labels:
    app: otel-trace-collector-daemon
spec:
  type: ClusterIP
  ports:
  - port: 8098
    targetPort: 8098
    protocol: TCP
    name: http
  selector:
    app: otel-trace-collector-daemon
