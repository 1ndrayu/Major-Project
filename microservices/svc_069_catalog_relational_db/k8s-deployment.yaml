apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-relational-db
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: catalog-relational-db
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: database
    service-id: svc-069
spec:
  replicas: 3
  selector:
    matchLabels:
      app: catalog-relational-db
  template:
    metadata:
      labels:
        app: catalog-relational-db
        tier: database
        service-id: svc-069
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8069"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-05
      containers:
      - name: catalog-relational-db
        image: selfhealing/catalog-relational-db:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8069
          name: http
        resources:
          requests:
            cpu: "350m"
            memory: "660Mi"
          limits:
            cpu: "1000m"
            memory: "1650Mi"
        env:
        - name: SERVICE_ID
          value: "svc-069"
        - name: SERVICE_NAME
          value: "Catalog-Relational-DB"
        - name: PORT
          value: "8069"
        - name: HIKARI_MAX_POOL_SIZE\n          value: '50'
        - name: HIKARI_IDLE_TIMEOUT_SEC\n          value: '30'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8069
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8069
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-relational-db
  namespace: self-healing-ecosystem
  labels:
    app: catalog-relational-db
spec:
  type: ClusterIP
  ports:
  - port: 8069
    targetPort: 8069
    protocol: TCP
    name: http
  selector:
    app: catalog-relational-db
