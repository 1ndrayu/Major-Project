apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-receipt-relay
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: customer-receipt-relay
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: order_payment
    service-id: svc-030
spec:
  replicas: 3
  selector:
    matchLabels:
      app: customer-receipt-relay
  template:
    metadata:
      labels:
        app: customer-receipt-relay
        tier: order_payment
        service-id: svc-030
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8030"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-06
      containers:
      - name: customer-receipt-relay
        image: selfhealing/customer-receipt-relay:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8030
          name: http
        resources:
          requests:
            cpu: "160m"
            memory: "280Mi"
          limits:
            cpu: "1000m"
            memory: "700Mi"
        env:
        - name: SERVICE_ID
          value: "svc-030"
        - name: SERVICE_NAME
          value: "Customer-Receipt-Relay"
        - name: PORT
          value: "8030"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8030
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8030
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: customer-receipt-relay
  namespace: self-healing-ecosystem
  labels:
    app: customer-receipt-relay
spec:
  type: ClusterIP
  ports:
  - port: 8030
    targetPort: 8030
    protocol: TCP
    name: http
  selector:
    app: customer-receipt-relay
