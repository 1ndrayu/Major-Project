apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui-frontend
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: web-ui-frontend
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: frontend
    service-id: svc-001
spec:
  replicas: 5
  selector:
    matchLabels:
      app: web-ui-frontend
  template:
    metadata:
      labels:
        app: web-ui-frontend
        tier: frontend
        service-id: svc-001
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01
      containers:
      - name: web-ui-frontend
        image: selfhealing/web-ui-frontend:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: http
        resources:
          requests:
            cpu: "180m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "640Mi"
        env:
        - name: SERVICE_ID
          value: "svc-001"
        - name: SERVICE_NAME
          value: "Web-UI-Frontend"
        - name: PORT
          value: "8001"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui-frontend
  namespace: self-healing-ecosystem
  labels:
    app: web-ui-frontend
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: web-ui-frontend
