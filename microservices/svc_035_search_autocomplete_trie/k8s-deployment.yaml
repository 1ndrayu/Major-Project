apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-autocomplete-trie
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: search-autocomplete-trie
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-035
spec:
  replicas: 3
  selector:
    matchLabels:
      app: search-autocomplete-trie
  template:
    metadata:
      labels:
        app: search-autocomplete-trie
        tier: middleware
        service-id: svc-035
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8035"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-03
      containers:
      - name: search-autocomplete-trie
        image: selfhealing/search-autocomplete-trie:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8035
          name: http
        resources:
          requests:
            cpu: "240m"
            memory: "440Mi"
          limits:
            cpu: "1000m"
            memory: "1100Mi"
        env:
        - name: SERVICE_ID
          value: "svc-035"
        - name: SERVICE_NAME
          value: "Search-Autocomplete-Trie"
        - name: PORT
          value: "8035"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8035
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8035
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: search-autocomplete-trie
  namespace: self-healing-ecosystem
  labels:
    app: search-autocomplete-trie
spec:
  type: ClusterIP
  ports:
  - port: 8035
    targetPort: 8035
    protocol: TCP
    name: http
  selector:
    app: search-autocomplete-trie
