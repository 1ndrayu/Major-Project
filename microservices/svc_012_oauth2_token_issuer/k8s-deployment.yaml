apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-token-issuer
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: oauth2-token-issuer
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-012
spec:
  replicas: 3
  selector:
    matchLabels:
      app: oauth2-token-issuer
  template:
    metadata:
      labels:
        app: oauth2-token-issuer
        tier: middleware
        service-id: svc-012
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8012"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-04
      containers:
      - name: oauth2-token-issuer
        image: selfhealing/oauth2-token-issuer:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8012
          name: http
        resources:
          requests:
            cpu: "220m"
            memory: "350Mi"
          limits:
            cpu: "1000m"
            memory: "875Mi"
        env:
        - name: SERVICE_ID
          value: "svc-012"
        - name: SERVICE_NAME
          value: "OAuth2-Token-Issuer"
        - name: PORT
          value: "8012"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8012
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8012
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-token-issuer
  namespace: self-healing-ecosystem
  labels:
    app: oauth2-token-issuer
spec:
  type: ClusterIP
  ports:
  - port: 8012
    targetPort: 8012
    protocol: TCP
    name: http
  selector:
    app: oauth2-token-issuer
