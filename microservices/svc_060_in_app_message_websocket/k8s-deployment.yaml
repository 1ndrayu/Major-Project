apiVersion: apps/v1
kind: Deployment
metadata:
  name: in-app-message-websocket
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: in-app-message-websocket
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: messaging
    service-id: svc-060
spec:
  replicas: 3
  selector:
    matchLabels:
      app: in-app-message-websocket
  template:
    metadata:
      labels:
        app: in-app-message-websocket
        tier: messaging
        service-id: svc-060
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8060"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-04
      containers:
      - name: in-app-message-websocket
        image: selfhealing/in-app-message-websocket:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8060
          name: http
        resources:
          requests:
            cpu: "310m"
            memory: "540Mi"
          limits:
            cpu: "1000m"
            memory: "1350Mi"
        env:
        - name: SERVICE_ID
          value: "svc-060"
        - name: SERVICE_NAME
          value: "In-App-Message-WebSocket"
        - name: PORT
          value: "8060"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8060
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8060
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: in-app-message-websocket
  namespace: self-healing-ecosystem
  labels:
    app: in-app-message-websocket
spec:
  type: ClusterIP
  ports:
  - port: 8060
    targetPort: 8060
    protocol: TCP
    name: http
  selector:
    app: in-app-message-websocket
