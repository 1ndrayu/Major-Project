apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-router
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: ingress-router
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: gateway
    service-id: svc-008
spec:
  replicas: 5
  selector:
    matchLabels:
      app: ingress-router
  template:
    metadata:
      labels:
        app: ingress-router
        tier: gateway
        service-id: svc-008
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8008"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-08
      containers:
      - name: ingress-router
        image: selfhealing/ingress-router:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8008
          name: http
        resources:
          requests:
            cpu: "350m"
            memory: "550Mi"
          limits:
            cpu: "1000m"
            memory: "1375Mi"
        env:
        - name: SERVICE_ID
          value: "svc-008"
        - name: SERVICE_NAME
          value: "Ingress-Router"
        - name: PORT
          value: "8008"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8008
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8008
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-router
  namespace: self-healing-ecosystem
  labels:
    app: ingress-router
spec:
  type: ClusterIP
  ports:
  - port: 8008
    targetPort: 8008
    protocol: TCP
    name: http
  selector:
    app: ingress-router
