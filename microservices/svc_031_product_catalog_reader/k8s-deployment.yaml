apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog-reader
  namespace: self-healing-ecosystem
  labels:
    app.kubernetes.io/name: product-catalog-reader
    app.kubernetes.io/part-of: self-healing-software-ecosystem
    tier: middleware
    service-id: svc-031
spec:
  replicas: 3
  selector:
    matchLabels:
      app: product-catalog-reader
  template:
    metadata:
      labels:
        app: product-catalog-reader
        tier: middleware
        service-id: svc-031
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8031"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-07
      containers:
      - name: product-catalog-reader
        image: selfhealing/product-catalog-reader:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8031
          name: http
        resources:
          requests:
            cpu: "340m"
            memory: "580Mi"
          limits:
            cpu: "1000m"
            memory: "1450Mi"
        env:
        - name: SERVICE_ID
          value: "svc-031"
        - name: SERVICE_NAME
          value: "Product-Catalog-Reader"
        - name: PORT
          value: "8031"
        
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8031
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8031
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog-reader
  namespace: self-healing-ecosystem
  labels:
    app: product-catalog-reader
spec:
  type: ClusterIP
  ports:
  - port: 8031
    targetPort: 8031
    protocol: TCP
    name: http
  selector:
    app: product-catalog-reader
